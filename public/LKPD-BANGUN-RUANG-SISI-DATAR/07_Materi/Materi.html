<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Pembelajaran</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #1e3c72;
            --light-blue: #2a5298;
            --dark-blue: #0f2444;
            --primary-red: #ff4e50;
            --light-red: #fc913a;
            --dark-red: #c92a2a;
            --primary-orange: #f9d423;
            --light-orange: #ff9a00;
            --dark-orange: #e47600;
            --white: #ffffff;
            --comic-yellow: #ffeb3b;
            --comic-blue: #00bcd4;
            --primary-green: #2ecc71;
            --dark-green: #27ae60;
        }
        
        body {
            font-family: 'Comic Neue', cursive;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-red), var(--primary-orange));
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
            position: relative;
        }
        
        /* Efek komik di background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 30%, rgba(255, 255, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 30% 70%, rgba(255, 255, 255, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 20%);
            z-index: -1;
        }
        
        /* Container utama */
        .main-container {
            padding: 2rem;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Tombol Close */
        .close-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            border: 4px solid var(--dark-blue);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.3);
            z-index: 1000;
            text-decoration: none;
            color: var(--white);
            animation: float 3s ease-in-out infinite;
        }
        
        .close-button::before {
            content: "";
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            background: linear-gradient(45deg, var(--comic-yellow) 25%, transparent 25%, transparent 75%, var(--comic-yellow) 75%, var(--comic-yellow)),
                        linear-gradient(45deg, var(--comic-yellow) 25%, transparent 25%, transparent 75%, var(--comic-yellow) 75%, var(--comic-yellow));
            background-size: 15px 15px;
            background-position: 0 0, 7.5px 7.5px;
            z-index: -1;
            opacity: 0.3;
            border-radius: 50%;
        }
        
        .close-button:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, var(--dark-red), #8b0000);
        }
        
        .close-button:active {
            transform: scale(0.95) rotate(0deg);
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
        }
        
        .close-button i {
            font-size: 1.5rem;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.2);
        }
        
        .close-tooltip {
            position: absolute;
            top: 70px;
            right: 50%;
            transform: translateX(50%);
            background: var(--dark-blue);
            color: var(--white);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-family: 'Bangers', cursive;
            font-size: 0.9rem;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.3);
        }
        
        .close-tooltip::before {
            content: "";
            position: absolute;
            top: -8px;
            right: 50%;
            transform: translateX(50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 8px solid var(--dark-blue);
        }
        
        .close-button:hover .close-tooltip {
            opacity: 1;
            visibility: visible;
            top: 75px;
        }
        
        /* Header */
        .header-section {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(30, 60, 114, 0.9), rgba(255, 78, 80, 0.9));
            border-radius: 25px;
            position: relative;
            overflow: hidden;
            border: 3px solid var(--comic-yellow);
        }
        
        /* Efek ledakan komik di header */
        .header-section::before {
            content: "BAM!";
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: 'Bangers', cursive;
            font-size: 2.5rem;
            color: var(--comic-yellow);
            transform: rotate(15deg);
            text-shadow: 3px 3px 0 #000;
            opacity: 0.8;
        }
        
        .main-title {
            font-family: 'Bangers', cursive;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--comic-yellow);
            margin-bottom: 0.5rem;
            text-shadow: 3px 3px 0 #000;
            letter-spacing: 2px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .subtitle {
            font-family: 'Comic Neue', cursive;
            font-size: 1.5rem;
            color: var(--white);
            font-weight: 700;
            text-shadow: 2px 2px 0 #000;
        }
        
        /* Embed Container */
        .embed-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 2rem;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            border: 5px solid var(--comic-yellow);
            position: relative;
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        /* Efek burst di container */
        .embed-container::before {
            content: "";
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: linear-gradient(45deg, var(--comic-yellow) 25%, transparent 25%, transparent 75%, var(--comic-yellow) 75%, var(--comic-yellow)),
                        linear-gradient(45deg, var(--comic-yellow) 25%, transparent 25%, transparent 75%, var(--comic-yellow) 75%, var(--comic-yellow));
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            z-index: -1;
            opacity: 0.3;
        }
        
        .embed-title {
            font-family: 'Bangers', cursive;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 1.5rem;
            text-align: center;
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.1);
        }
        
        .embed-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            border: 3px solid var(--primary-blue);
            box-shadow: 5px 5px 0 rgba(0, 0, 0, 0.3);
            flex: 1;
        }
        
        .embed-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }
        
        /* Loading Animation */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
            border-radius: 12px;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid var(--comic-yellow);
            border-top: 6px solid var(--primary-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        .loading-text {
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            color: var(--primary-blue);
            text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.1);
        }
        
        /* Ikon berterbangan */
        .floating-icon {
            position: fixed;
            font-size: 2rem;
            color: var(--comic-yellow);
            opacity: 0.7;
            animation: floatAround 15s linear infinite;
            z-index: 0;
            text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.3);
        }
        
        .floating-icon:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-duration: 20s;
            animation-delay: 0s;
        }
        
        .floating-icon:nth-child(2) {
            top: 20%;
            right: 15%;
            animation-duration: 25s;
            animation-delay: 2s;
        }
        
        .floating-icon:nth-child(3) {
            bottom: 30%;
            left: 5%;
            animation-duration: 18s;
            animation-delay: 4s;
        }
        
        .floating-icon:nth-child(4) {
            bottom: 20%;
            right: 10%;
            animation-duration: 22s;
            animation-delay: 6s;
        }
        
        .floating-icon:nth-child(5) {
            top: 50%;
            left: 50%;
            animation-duration: 30s;
            animation-delay: 8s;
        }
        
        .floating-icon:nth-child(6) {
            top: 70%;
            left: 80%;
            animation-duration: 17s;
            animation-delay: 10s;
        }
        
        /* Animasi */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes floatAround {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(100px, -50px) rotate(90deg); }
            50% { transform: translate(-50px, -100px) rotate(180deg); }
            75% { transform: translate(-100px, 50px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
            }
            
            .main-title {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .embed-container {
                padding: 1rem;
            }
            
            .close-button {
                width: 50px;
                height: 50px;
            }
            
            .close-button i {
                font-size: 1.2rem;
            }
        }
        
        @media (max-width: 576px) {
            .main-title {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .close-button {
                width: 45px;
                height: 45px;
                top: 15px;
                right: 15px;
            }
            
            .close-button i {
                font-size: 1rem;
            }
            
            .close-tooltip {
                font-size: 0.8rem;
                padding: 0.3rem 0.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Ikon berterbangan -->
    <i class="fas fa-star floating-icon"></i>
    <i class="fas fa-calculator floating-icon"></i>
    <i class="fas fa-shapes floating-icon"></i>
    <i class="fas fa-ruler floating-icon"></i>
    <i class="fas fa-cube floating-icon"></i>
    <i class="fas fa-graduation-cap floating-icon"></i>
    
    <!-- Tombol Close -->
    <button class="close-button" id="closeBtn" aria-label="Tutup">
        <i class="fas fa-times"></i>
        <span class="close-tooltip">Tutup Jendela</span>
    </button>
    
    <div class="main-container">
        <header class="header-section">
            <h1 class="main-title">MEDIA PEMBELAJARAN</h1>
            <p class="subtitle">Bangun Ruang Sisi Datar</p>
        </header>
        
        <main class="embed-container">
            <div class="embed-wrapper">
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Memuat Materi...</div>
                </div>
                
                <iframe 
                    src="https://www.aplikasipelajaran.com/bangun-ruang-sisi-datar/" 
                    title="E-Modul Bangun Ruang Sisi Datar"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen
                    id="embedFrame">
                </iframe>
            </div>
        </main>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elemen DOM
            const closeBtn = document.getElementById('closeBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const embedFrame = document.getElementById('embedFrame');
            
            // Event Listeners
            closeBtn.addEventListener('click', function() {
                // Coba tutup jendela
                window.close();
                
                // Jika tidak bisa tutup (karena bukan dibuka dengan script), tampilkan alert
                setTimeout(function() {
                    if (!window.closed) {
                        if (confirm("Apakah Anda ingin menutup halaman ini?")) {
                            // Redirect ke halaman sebelumnya atau halaman utama
                            window.history.back();
                        }
                    }
                }, 500);
            });
            
            // Sembunyikan loading overlay setelah iframe dimuat
            embedFrame.addEventListener('load', function() {
                setTimeout(function() {
                    loadingOverlay.style.display = 'none';
                }, 1000); // Tunggu 1 detik untuk efek yang lebih baik
            });
            
            // Tambahkan lebih banyak floating icons secara dinamis
            function createRandomIcon() {
                const icons = ['fa-star', 'fa-calculator', 'fa-shapes', 'fa-ruler', 'fa-cube', 'fa-graduation-cap', 'fa-book', 'fa-pencil-ruler', 'fa-chart-line', 'fa-square-root-alt'];
                const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                const iconElement = document.createElement('i');
                iconElement.className = `fas ${randomIcon} floating-icon`;
                iconElement.style.top = Math.random() * 100 + '%';
                iconElement.style.left = Math.random() * 100 + '%';
                iconElement.style.animationDuration = (15 + Math.random() * 15) + 's';
                iconElement.style.animationDelay = Math.random() * 5 + 's';
                iconElement.style.fontSize = (1.5 + Math.random() * 1.5) + 'rem';
                document.body.appendChild(iconElement);
                
                // Hapus icon setelah animasi selesai
                setTimeout(() => {
                    iconElement.remove();
                }, 30000);
            }
            
            // Buat 3 icon tambahan setiap 5 detik
            setInterval(createRandomIcon, 5000);
            
            // Efek parallax pada scroll
            window.addEventListener('scroll', function() {
                const scrolled = window.pageYOffset;
                const floatingIcons = document.querySelectorAll('.floating-icon');
                
                floatingIcons.forEach((icon, index) => {
                    const speed = 0.5 + (index * 0.1);
                    icon.style.transform = `translateY(${scrolled * speed}px)`;
                });
            });
        });
    </script>
</body>
</html>
