<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I SIAP SELEM - Konten Edukasi Interaktif</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1a2a6c;
            --secondary: #b21f1f;
            --accent: #fdbb2d;
        }

        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            padding: 15px 0;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-weight: 800;
            font-size: 2.2rem;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .header h2 {
            font-weight: 500;
            font-size: 1.3rem;
            margin: 8px 0 0;
            color: var(--accent);
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .video-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            overflow: hidden;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .info-footer {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .info-footer h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--accent);
        }

        .info-footer p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .controls {
            position: absolute;
            bottom: 90px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(253, 187, 45, 0.9);
            color: #1a2a6c;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .control-btn:hover {
            transform: scale(1.1);
            background: var(--accent);
        }

        /* Responsive adjustments */
        @media (max-width: 992px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .header h2 {
                font-size: 1.1rem;
            }

            .container-wrapper {
                padding: 15px;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.6rem;
            }

            .header h2 {
                font-size: 1rem;
            }

            .container-wrapper {
                padding: 10px;
            }

            .controls {
                bottom: 80px;
                right: 15px;
            }

            .control-btn {
                width: 45px;
                height: 45px;
            }
        }

        @media (max-height: 800px) {
            .header {
                padding: 10px 0;
                margin-bottom: 10px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .header h2 {
                font-size: 1.1rem;
            }

            .info-footer {
                padding: 10px 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container-wrapper">
        <div class="header">
            <h1>I SIAP SELEM</h1>
            <h2>AYAM HITAM YANG BAIK HATI</h2>
        </div>

        <div class="content-wrapper">
            <div class="video-container">
                <iframe src="https://app.lumi.education/api/v1/run/BtV32H/embed" frameborder="0"
                    allowfullscreen="allowfullscreen"
                    allow="geolocation *; microphone *; camera *; midi *; encrypted-media *"></iframe>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="control-btn" onclick="toggleFullscreen()">
            <i class="fas fa-expand"></i>
        </button>
        <button class="control-btn" onclick="reloadVideo()">
            <i class="fas fa-redo"></i>
        </button>
    </div>

    <script src="https://app.Lumi.education/api/v1/h5p/core/js/h5p-resizer.js" charset="UTF-8"></script>

    <script>
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function reloadVideo() {
            const iframe = document.querySelector('iframe');
            iframe.src = iframe.src;
        }

        // Menyesuaikan ukuran iframe secara dinamis
        function adjustLayout() {
            const header = document.querySelector('.header');
            const footer = document.querySelector('.info-footer');
            const videoContainer = document.querySelector('.video-container');

            const headerHeight = header.offsetHeight;
            const footerHeight = footer.offsetHeight;
            const wrapperHeight = document.querySelector('.content-wrapper').offsetHeight;

            // Atur tinggi video container
            videoContainer.style.height = (wrapperHeight - footerHeight) + 'px';
        }

        // Panggil fungsi penyesuaian saat halaman dimuat dan diresize
        window.addEventListener('load', adjustLayout);
        window.addEventListener('resize', adjustLayout);
    </script>
</body>

</html>
